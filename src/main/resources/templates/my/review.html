<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>복습 - eduplatform</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{fragments/layout :: header}"></div>

    <main class="page">
    <h1>복습</h1>
    <p>완료한 지 오래된 레슨부터 보여드려요. 다시 훑어보고 "복습 완료"를 누르면 목록에서 빠져요.</p>

    <p class="empty-state" th:if="${#lists.isEmpty(dueLessons)}">
        지금 복습할 레슨이 없어요. 완료한 레슨이 며칠 지나면 여기에 나타나요.
    </p>

    <ul class="lesson-list" th:unless="${#lists.isEmpty(dueLessons)}">
        <li th:each="w : ${dueLessons}">
            <div class="lesson-row">
                <span class="lesson-text">
                    <span class="lesson-eyebrow" th:text="${w.courseTitle}"></span>
                    <a class="lesson-title" th:href="@{/lessons/{id}(id=${w.lessonId})}" th:text="${w.lessonTitle}"></a>
                </span>
                <span th:text="${#temporals.format(w.completedAt, 'yyyy-MM-dd')} + ' 완료'"></span>
                <form th:action="@{/my/review/{id}(id=${w.lessonId})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit">복습 완료로 표시</button>
                </form>
            </div>
        </li>
    </ul>

    <p><a th:href="@{/my}">마이페이지로 돌아가기</a></p>
    </main>
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
