<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>프로필 수정 - eduplatform</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{fragments/layout :: header}"></div>

    <main class="page">
    <h1>프로필 수정</h1>

    <ul class="error-message" th:if="${validationErrors}">
        <li th:each="msg : ${validationErrors}" th:text="${msg}"></li>
    </ul>
    <p class="error-message" th:if="${errorMessage}" th:text="${errorMessage}"></p>
    <p th:if="${updated}">프로필이 수정됐어요.</p>
    <p th:if="${passwordChanged}">비밀번호가 변경됐어요. 다음 로그인부터 새 비밀번호로 로그인해 주세요.</p>

    <h2>기본 정보</h2>
    <form th:action="@{/my/profile}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div>
            <label>이메일 <input type="email" th:value="${member.email}" disabled/></label>
        </div>
        <div>
            <label>닉네임 <input type="text" name="nickname" th:value="${member.nickname}"/></label>
        </div>
        <div>
            <label>학습 레벨
                <select name="level">
                    <option th:each="lvl : ${levels}"
                            th:value="${lvl}"
                            th:selected="${member.level == lvl}"
                            th:text="${lvl}"></option>
                </select>
            </label>
        </div>
        <button type="submit">저장</button>
    </form>

    <h2>비밀번호 변경</h2>
    <form th:action="@{/my/profile/password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div>
            <label>현재 비밀번호 <input type="password" name="currentPassword"/></label>
        </div>
        <div>
            <label>새 비밀번호 <input type="password" name="newPassword"/></label>
        </div>
        <button type="submit">비밀번호 변경</button>
    </form>

    <p><a th:href="@{/my}">마이페이지로 돌아가기</a></p>
    </main>
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
