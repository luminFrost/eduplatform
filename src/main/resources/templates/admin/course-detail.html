<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${course.title} + ' 관리 - eduplatform'"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{fragments/layout :: header}"></div>

    <main id="main-content" class="page">
    <div class="course-header">
        <span class="course-emoji large" th:text="${course.emoji}"></span>
        <span class="badge" th:text="${course.targetType}"></span>
        <span class="badge" th:text="${course.level}"></span>
        <h1 th:text="${course.title}"></h1>
        <p th:text="${course.description}"></p>
    </div>

    <p><a th:href="@{/admin/courses/{id}/edit(id=${course.id})}">코스 정보 수정</a></p>
    <p><a th:href="@{/admin/courses/{courseId}/lessons/new(courseId=${course.id})}">+ 새 레슨 추가</a></p>

    <p class="empty-state" th:if="${#lists.isEmpty(lessons)}">아직 등록된 레슨이 없습니다.</p>

    <ul class="lesson-list" th:unless="${#lists.isEmpty(lessons)}">
        <li th:each="lesson : ${lessons}" th:classappend="'type-' + ${#strings.toLowerCase(lesson.lessonType.name())}">
            <div class="lesson-row">
                <span class="lesson-text">
                    <span class="lesson-eyebrow" th:text="${lesson.orderNo} + '과'"></span>
                    <span class="lesson-title" th:text="${lesson.title}"></span>
                </span>
                <span class="lesson-type-tag" th:switch="${lesson.lessonType.name()}">
                    <span th:case="'VOCAB'">어휘</span>
                    <span th:case="'READING'">읽기</span>
                    <span th:case="'WRITING'">쓰기</span>
                    <span th:case="'LISTENING'">듣기</span>
                    <span th:case="'SPEAKING'">말하기</span>
                </span>
                <a th:href="@{/admin/lessons/{id}/edit(id=${lesson.id})}">수정</a>
                <form th:action="@{/admin/lessons/{id}/delete(id=${lesson.id})}" method="post" class="lesson-delete-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit">삭제</button>
                </form>
            </div>
        </li>
    </ul>

    <p><a th:href="@{/admin/courses}">코스 관리로 돌아가기</a></p>
    </main>
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
