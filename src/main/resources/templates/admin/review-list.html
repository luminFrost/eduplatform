<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>관리자 · 리뷰 관리 - eduplatform</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{fragments/layout :: header}"></div>

    <main id="main-content" class="page page-wide">
    <h1>리뷰 관리</h1>
    <p><a th:href="@{/admin/courses}">코스 관리 →</a> · <a th:href="@{/admin/questions}">문항 관리 →</a> · <a th:href="@{/admin/members}">회원 관리 →</a> · <a th:href="@{/admin}">대시보드 →</a></p>

    <p class="empty-state" th:if="${#lists.isEmpty(reviews)}">등록된 리뷰가 없습니다.</p>

    <ul class="lesson-list" th:unless="${#lists.isEmpty(reviews)}">
        <li th:each="r : ${reviews}">
            <div class="lesson-row">
                <span class="lesson-text">
                    <span class="lesson-eyebrow">
                        <a th:href="@{/courses/{id}(id=${r.courseId})}" th:text="${r.courseTitle}"></a>
                        · <span th:text="${r.reviewerNickname}"></span>
                        · <span th:text="${'⭐'.repeat(r.rating())}"></span>
                        <span th:if="${r.reportCount > 0}" class="badge reported" th:text="'🚩 신고 ' + ${r.reportCount}"></span>
                    </span>
                    <span class="lesson-title" th:if="${r.comment != null and !r.comment.isEmpty()}" th:text="${r.comment}"></span>
                </span>
                <span class="lesson-eyebrow" th:text="${#temporals.format(r.createdAt, 'yyyy-MM-dd')}"></span>
                <form th:action="@{/admin/reviews/{id}/delete(id=${r.id})}" method="post" class="lesson-delete-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit">삭제</button>
                </form>
            </div>
        </li>
    </ul>
    </main>
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
