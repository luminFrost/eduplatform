<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="(${lessonId} != null ? '레슨 수정' : '새 레슨') + ' - eduplatform'"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{fragments/layout :: header}"></div>

    <main id="main-content" class="page">
    <h1 th:text="${lessonId} != null ? '레슨 수정' : '새 레슨 추가'"></h1>

    <ul class="error-message" th:if="${validationErrors}">
        <li th:each="msg : ${validationErrors}" th:text="${msg}"></li>
    </ul>

    <form th:action="${lessonId} != null ? @{/admin/lessons/{id}/edit(id=${lessonId})} : @{/admin/courses/{courseId}/lessons/new(courseId=${courseId})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div>
            <label>레슨 제목 <input type="text" name="title" th:value="${form?.title}"/></label>
        </div>
        <div>
            <label>순서(orderNo) <input type="number" name="orderNo" th:value="${form?.orderNo}"/></label>
        </div>
        <div>
            <label>영역
                <select name="lessonType">
                    <option th:each="type : ${lessonTypes}"
                            th:value="${type}"
                            th:selected="${form != null and form.lessonType == type}"
                            th:text="${type}"></option>
                </select>
            </label>
        </div>
        <div>
            <label>내용
                <textarea name="content" rows="10" th:text="${form?.content}"></textarea>
            </label>
            <p class="empty-state">
                한 줄에 한 항목. 마스코트 인사말은 "INTRO: 문구"로, 예문은 "English sentence — 한글 번역"
                형식으로 씁니다(하이픈이 아니라 " — " em dash). 이 형식이 아닌 줄은 단문(NOTE)으로 표시됩니다.
            </p>
        </div>
        <button type="submit" th:text="${lessonId} != null ? '수정하기' : '추가하기'"></button>
    </form>

    <p><a th:href="@{/admin/courses/{id}(id=${courseId})}">코스로 돌아가기</a></p>
    </main>
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
