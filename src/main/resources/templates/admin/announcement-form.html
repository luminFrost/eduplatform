<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>관리자 · 공지 관리 - eduplatform</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{fragments/layout :: header}"></div>

    <main id="main-content" class="page">
    <h1>공지 관리</h1>
    <p><a th:href="@{/admin/courses}">코스 관리 →</a> · <a th:href="@{/admin/questions}">문항 관리 →</a> · <a th:href="@{/admin/members}">회원 관리 →</a> · <a th:href="@{/admin/reviews}">리뷰 관리 →</a> · <a th:href="@{/admin}">대시보드 →</a></p>

    <ul class="error-message" th:if="${validationErrors}">
        <li th:each="msg : ${validationErrors}" th:text="${msg}"></li>
    </ul>

    <p class="empty-state" th:if="${currentMessage == null}">현재 게시된 공지가 없습니다.</p>

    <form th:action="@{/admin/announcement}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div>
            <label>공지 내용 <textarea name="message" th:text="${currentMessage}"></textarea></label>
        </div>
        <button type="submit" th:text="${currentMessage != null} ? '수정하기' : '게시하기'"></button>
    </form>

    <form th:if="${currentMessage != null}" th:action="@{/admin/announcement/delete}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit">공지 삭제</button>
    </form>
    </main>
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
