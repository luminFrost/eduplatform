<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>관리자 · 회원 관리 - eduplatform</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{fragments/layout :: header}"></div>

    <main id="main-content" class="page page-wide">
    <h1>회원 관리</h1>
    <p><a th:href="@{/admin/courses}">코스 관리 →</a> · <a th:href="@{/admin/questions}">문항 관리 →</a> · <a th:href="@{/admin/reviews}">리뷰 관리 →</a> · <a th:href="@{/admin/announcement}">공지 관리 →</a> · <a th:href="@{/admin}">대시보드 →</a></p>

    <p class="error-message" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <form class="filter-form" th:action="@{/admin/members}" method="get">
        <div>
            <label>검색</label>
            <input type="text" name="keyword" th:value="${selectedKeyword}" placeholder="이메일·닉네임 검색"/>
        </div>
        <button type="submit">검색</button>
    </form>

    <p class="empty-state" th:if="${#lists.isEmpty(members)}">조건에 맞는 회원이 없습니다.</p>

    <ul class="lesson-list" th:unless="${#lists.isEmpty(members)}">
        <li th:each="m : ${members}">
            <div class="lesson-row">
                <span class="lesson-text">
                    <span class="lesson-eyebrow" th:text="${m.email}"></span>
                    <span class="lesson-title" th:text="${m.nickname}"></span>
                </span>
                <span class="badge" th:text="${m.memberType}"></span>
                <span class="badge" th:text="${m.level}"></span>
                <span class="badge" th:text="${m.role}"></span>
                <span class="lesson-eyebrow" th:text="${#temporals.format(m.createdAt, 'yyyy-MM-dd')}"></span>
                <span th:if="${m.id == currentMemberId}">(나)</span>
                <form th:unless="${m.id == currentMemberId}"
                      th:action="@{/admin/members/{id}/role(id=${m.id})}" method="post" class="lesson-delete-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="keyword" th:value="${selectedKeyword}"/>
                    <input type="hidden" name="role" th:value="${m.role.name() == 'ADMIN'} ? 'USER' : 'ADMIN'"/>
                    <button type="submit" th:text="${m.role.name() == 'ADMIN'} ? '일반 회원으로 강등' : '관리자로 승격'"></button>
                </form>
                <form th:unless="${m.id == currentMemberId}"
                      th:action="@{/admin/members/{id}/withdraw(id=${m.id})}" method="post" class="lesson-delete-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="keyword" th:value="${selectedKeyword}"/>
                    <button type="submit">탈퇴시키기</button>
                </form>
            </div>
        </li>
    </ul>
    </main>
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
