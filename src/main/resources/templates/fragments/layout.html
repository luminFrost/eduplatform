<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <header class="site-header" th:fragment="header">
        <a href="#main-content" class="skip-link">본문으로 바로가기</a>
        <div class="site-announcement" th:if="${siteAnnouncementMessage != null}" th:text="${siteAnnouncementMessage}"></div>
        <a class="brand" th:href="@{/}"><span class="brand-emoji">🦊</span> eduplatform</a>
        <nav class="site-nav">
            <a th:href="@{/courses}">코스</a>
            <a th:href="@{/quiz/picture}">그림 퀴즈</a>
            <a th:href="@{/my}" sec:authorize="isAuthenticated()">
                마이페이지
                <span class="review-badge" th:if="${dueReviewCount != null and dueReviewCount > 0}" th:text="${dueReviewCount}"></span>
            </a>
            <a th:href="@{/admin}" sec:authorize="hasRole('ADMIN')">관리자</a>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="nav-logout-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="link-button">로그아웃</button>
            </form>
            <a th:href="@{/login}" sec:authorize="isAnonymous()">로그인</a>
            <a th:href="@{/members/new}" sec:authorize="isAnonymous()">회원가입</a>
            <button type="button" id="theme-toggle" class="theme-toggle" aria-label="다크 모드 전환">🌙</button>
        </nav>
        <script th:src="@{/js/theme-toggle.js}" defer></script>
    </header>

    <footer class="site-footer" th:fragment="footer">
        <p>아이콘: <a href="https://www.openmoji.org" target="_blank" rel="noopener noreferrer">OpenMoji</a> (CC BY-SA 4.0)</p>
    </footer>
</body>
</html>
