<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <header class="site-header" th:fragment="header">
        <a class="brand" th:href="@{/}"><span class="brand-emoji">🦊</span> eduplatform</a>
        <nav class="site-nav">
            <a th:href="@{/courses}">코스</a>
            <a th:href="@{/my}" sec:authorize="isAuthenticated()">마이페이지</a>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="nav-logout-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="link-button">로그아웃</button>
            </form>
            <a th:href="@{/login}" sec:authorize="isAnonymous()">로그인</a>
            <a th:href="@{/members/new}" sec:authorize="isAnonymous()">회원가입</a>
        </nav>
    </header>

    <footer class="site-footer" th:fragment="footer">
        <p>아이콘: <a href="https://www.openmoji.org" target="_blank" rel="noopener noreferrer">OpenMoji</a> (CC BY-SA 4.0)</p>
    </footer>
</body>
</html>
