<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>코스 목록 - eduplatform</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{fragments/layout :: header}"></div>

    <main id="main-content" class="page page-wide">
    <h1>코스 목록</h1>

    <form class="filter-form" th:action="@{/courses}" method="get">
        <div>
            <label>대상</label>
            <select name="target">
                <option value="" th:selected="${selectedTarget == null or selectedTarget == ''}">전체</option>
                <option th:each="type : ${memberTypes}"
                        th:value="${type}"
                        th:selected="${selectedTarget == type.name()}"
                        th:text="${type}"></option>
            </select>
        </div>
        <div>
            <label>검색</label>
            <input type="text" name="keyword" th:value="${selectedKeyword}" placeholder="코스 제목·설명 검색"/>
        </div>
        <div>
            <label>정렬</label>
            <select name="sort">
                <option value="" th:selected="${selectedSort == null or selectedSort == ''}">추천순</option>
                <option value="RATING" th:selected="${selectedSort == 'RATING'}">평점순</option>
                <option value="BOOKMARKS" th:selected="${selectedSort == 'BOOKMARKS'}">즐겨찾기순</option>
            </select>
        </div>
        <input type="hidden" name="level" th:value="${selectedLevel}"/>
        <input type="hidden" name="type" th:value="${selectedSkillType}"/>
        <button type="submit">필터 적용</button>
    </form>

    <div class="level-path">
        <a class="level-node" th:href="@{/courses(target=${selectedTarget},type=${selectedSkillType},keyword=${selectedKeyword},sort=${selectedSort})}"
           th:classappend="${selectedLevel == null or selectedLevel == ''} ? ' active' : ''">전체</a>
        <span class="level-connector"></span>
        <a class="level-node" th:href="@{/courses(target=${selectedTarget},level='BEGINNER',type=${selectedSkillType},keyword=${selectedKeyword},sort=${selectedSort})}"
           th:classappend="${selectedLevel == 'BEGINNER'} ? ' active' : ''">입문</a>
        <span class="level-connector"></span>
        <a class="level-node" th:href="@{/courses(target=${selectedTarget},level='ELEMENTARY',type=${selectedSkillType},keyword=${selectedKeyword},sort=${selectedSort})}"
           th:classappend="${selectedLevel == 'ELEMENTARY'} ? ' active' : ''">초급</a>
        <span class="level-connector"></span>
        <a class="level-node" th:href="@{/courses(target=${selectedTarget},level='INTERMEDIATE',type=${selectedSkillType},keyword=${selectedKeyword},sort=${selectedSort})}"
           th:classappend="${selectedLevel == 'INTERMEDIATE'} ? ' active' : ''">중급</a>
        <span class="level-connector"></span>
        <a class="level-node" th:href="@{/courses(target=${selectedTarget},level='ADVANCED',type=${selectedSkillType},keyword=${selectedKeyword},sort=${selectedSort})}"
           th:classappend="${selectedLevel == 'ADVANCED'} ? ' active' : ''">고급</a>
    </div>

    <div class="skill-tabs">
        <a th:href="@{/courses(target=${selectedTarget},level=${selectedLevel},keyword=${selectedKeyword},sort=${selectedSort})}"
           th:class="${selectedSkillType == null or selectedSkillType == ''} ? 'skill-tab active' : 'skill-tab'">전체 영역</a>
        <th:block th:each="t : ${lessonTypes}" th:switch="${t.name()}">
            <a th:case="'VOCAB'" th:href="@{/courses(target=${selectedTarget},level=${selectedLevel},type=${t},keyword=${selectedKeyword},sort=${selectedSort})}"
               th:class="${selectedSkillType == t.name()} ? 'skill-tab active' : 'skill-tab'">어휘</a>
            <a th:case="'READING'" th:href="@{/courses(target=${selectedTarget},level=${selectedLevel},type=${t},keyword=${selectedKeyword},sort=${selectedSort})}"
               th:class="${selectedSkillType == t.name()} ? 'skill-tab active' : 'skill-tab'">읽기</a>
            <a th:case="'WRITING'" th:href="@{/courses(target=${selectedTarget},level=${selectedLevel},type=${t},keyword=${selectedKeyword},sort=${selectedSort})}"
               th:class="${selectedSkillType == t.name()} ? 'skill-tab active' : 'skill-tab'">쓰기</a>
            <a th:case="'LISTENING'" th:href="@{/courses(target=${selectedTarget},level=${selectedLevel},type=${t},keyword=${selectedKeyword},sort=${selectedSort})}"
               th:class="${selectedSkillType == t.name()} ? 'skill-tab active' : 'skill-tab'">듣기</a>
            <a th:case="'SPEAKING'" th:href="@{/courses(target=${selectedTarget},level=${selectedLevel},type=${t},keyword=${selectedKeyword},sort=${selectedSort})}"
               th:class="${selectedSkillType == t.name()} ? 'skill-tab active' : 'skill-tab'">말하기</a>
        </th:block>
    </div>

    <div th:if="${selectedKeyword != null and selectedKeyword != '' and not #lists.isEmpty(lessonResults)}">
        <h2>레슨에서 찾은 결과</h2>
        <ul class="lesson-list">
            <li th:each="r : ${lessonResults}">
                <a class="lesson-row" th:href="@{/lessons/{id}(id=${r.lessonId})}">
                    <span class="lesson-text">
                        <span class="lesson-eyebrow" th:text="${r.courseTitle}"></span>
                        <span class="lesson-title" th:text="${r.lessonTitle}"></span>
                        <span class="kr" th:if="${r.snippetText}"
                              th:text="${r.snippetText} + (${r.snippetSubtext} != null ? ' — ' + ${r.snippetSubtext} : '')"></span>
                    </span>
                    <span class="lesson-chevron">›</span>
                </a>
            </li>
        </ul>
    </div>

    <p class="empty-state" th:if="${#lists.isEmpty(courses)}">조건에 맞는 코스가 없습니다.</p>

    <div class="card-grid" th:unless="${#lists.isEmpty(courses)}">
        <a class="card course-card" th:each="c, cStat : ${courses}"
           th:href="@{/courses/{id}(id=${c.id})}"
           th:classappend="'accent-' + (${cStat.index} % 4)">
            <span class="course-card-icon" th:text="${c.emoji}"></span>
            <div class="course-card-badges">
                <span class="badge new" th:if="${c.recentlyAdded}">🆕 NEW</span>
                <span class="badge" th:text="${c.targetType}"></span>
                <span class="badge" th:text="${c.level}"></span>
                <span class="badge" th:if="${ratingSummaries[c.id] != null}"
                      th:text="'⭐ ' + ${#numbers.formatDecimal(ratingSummaries[c.id].average(), 1, 1)}"></span>
                <span class="badge" th:if="${learnerCounts[c.id] != null}"
                      th:text="'👥 ' + ${learnerCounts[c.id]}"></span>
            </div>
            <h3 th:text="${c.title}"></h3>
            <p th:text="${c.description}"></p>
            <span class="card-cta">레슨 보기 <span class="lesson-chevron">›</span></span>
        </a>
    </div>
    </main>
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
