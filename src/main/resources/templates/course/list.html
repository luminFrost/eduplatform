<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>코스 목록 - eduplatform</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{fragments/layout :: header}"></div>

    <main class="page page-wide">
    <h1>코스 목록</h1>

    <form class="filter-form" th:action="@{/courses}" method="get">
        <div>
            <label>대상</label>
            <select name="target">
                <option value="" th:selected="${selectedTarget == null or selectedTarget == ''}">전체</option>
                <option th:each="type : ${memberTypes}"
                        th:value="${type}"
                        th:selected="${selectedTarget == type.name()}"
                        th:text="${type}"></option>
            </select>
        </div>
        <input type="hidden" name="level" th:value="${selectedLevel}"/>
        <input type="hidden" name="type" th:value="${selectedSkillType}"/>
        <button type="submit">필터 적용</button>
    </form>

    <div class="level-path">
        <a class="level-node" th:href="@{/courses(target=${selectedTarget},type=${selectedSkillType})}"
           th:classappend="${selectedLevel == null or selectedLevel == ''} ? ' active' : ''">전체</a>
        <span class="level-connector"></span>
        <a class="level-node" th:href="@{/courses(target=${selectedTarget},level='BEGINNER',type=${selectedSkillType})}"
           th:classappend="${selectedLevel == 'BEGINNER'} ? ' active' : ''">입문</a>
        <span class="level-connector"></span>
        <a class="level-node" th:href="@{/courses(target=${selectedTarget},level='ELEMENTARY',type=${selectedSkillType})}"
           th:classappend="${selectedLevel == 'ELEMENTARY'} ? ' active' : ''">초급</a>
        <span class="level-connector"></span>
        <a class="level-node" th:href="@{/courses(target=${selectedTarget},level='INTERMEDIATE',type=${selectedSkillType})}"
           th:classappend="${selectedLevel == 'INTERMEDIATE'} ? ' active' : ''">중급</a>
        <span class="level-connector"></span>
        <a class="level-node" th:href="@{/courses(target=${selectedTarget},level='ADVANCED',type=${selectedSkillType})}"
           th:classappend="${selectedLevel == 'ADVANCED'} ? ' active' : ''">고급</a>
    </div>

    <div class="skill-tabs">
        <a th:href="@{/courses(target=${selectedTarget},level=${selectedLevel})}"
           th:class="${selectedSkillType == null or selectedSkillType == ''} ? 'skill-tab active' : 'skill-tab'">전체 영역</a>
        <th:block th:each="t : ${lessonTypes}" th:switch="${t.name()}">
            <a th:case="'VOCAB'" th:href="@{/courses(target=${selectedTarget},level=${selectedLevel},type=${t})}"
               th:class="${selectedSkillType == t.name()} ? 'skill-tab active' : 'skill-tab'">어휘</a>
            <a th:case="'READING'" th:href="@{/courses(target=${selectedTarget},level=${selectedLevel},type=${t})}"
               th:class="${selectedSkillType == t.name()} ? 'skill-tab active' : 'skill-tab'">읽기</a>
            <a th:case="'WRITING'" th:href="@{/courses(target=${selectedTarget},level=${selectedLevel},type=${t})}"
               th:class="${selectedSkillType == t.name()} ? 'skill-tab active' : 'skill-tab'">쓰기</a>
            <a th:case="'LISTENING'" th:href="@{/courses(target=${selectedTarget},level=${selectedLevel},type=${t})}"
               th:class="${selectedSkillType == t.name()} ? 'skill-tab active' : 'skill-tab'">듣기</a>
            <a th:case="'SPEAKING'" th:href="@{/courses(target=${selectedTarget},level=${selectedLevel},type=${t})}"
               th:class="${selectedSkillType == t.name()} ? 'skill-tab active' : 'skill-tab'">말하기</a>
        </th:block>
    </div>

    <p class="empty-state" th:if="${#lists.isEmpty(courses)}">조건에 맞는 코스가 없습니다.</p>

    <div class="card-grid" th:unless="${#lists.isEmpty(courses)}">
        <div class="card course-card" th:each="c : ${courses}">
            <span class="course-emoji" th:text="${c.emoji}"></span>
            <span class="badge" th:text="${c.targetType}"></span>
            <span class="badge" th:text="${c.level}"></span>
            <h3 th:text="${c.title}"></h3>
            <p th:text="${c.description}"></p>
            <a th:href="@{/courses/{id}(id=${c.id})}">레슨 보기 →</a>
        </div>
    </div>
    </main>
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
