<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>코스 목록 - eduplatform</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <h1>코스 목록</h1>

    <form class="filter-form" th:action="@{/courses}" method="get">
        <div>
            <label>대상</label>
            <select name="target">
                <option value="" th:selected="${selectedTarget == null or selectedTarget == ''}">전체</option>
                <option th:each="type : ${memberTypes}"
                        th:value="${type}"
                        th:selected="${selectedTarget == type.name()}"
                        th:text="${type}"></option>
            </select>
        </div>
        <input type="hidden" name="level" th:value="${selectedLevel}"/>
        <button type="submit">필터 적용</button>
    </form>

    <div class="level-path">
        <a class="level-node" th:href="@{/courses(target=${selectedTarget})}"
           th:classappend="${selectedLevel == null or selectedLevel == ''} ? ' active' : ''">전체</a>
        <span class="level-connector"></span>
        <a class="level-node" th:href="@{/courses(target=${selectedTarget},level='BEGINNER')}"
           th:classappend="${selectedLevel == 'BEGINNER'} ? ' active' : ''">입문</a>
        <span class="level-connector"></span>
        <a class="level-node" th:href="@{/courses(target=${selectedTarget},level='ELEMENTARY')}"
           th:classappend="${selectedLevel == 'ELEMENTARY'} ? ' active' : ''">초급</a>
        <span class="level-connector"></span>
        <a class="level-node" th:href="@{/courses(target=${selectedTarget},level='INTERMEDIATE')}"
           th:classappend="${selectedLevel == 'INTERMEDIATE'} ? ' active' : ''">중급</a>
        <span class="level-connector"></span>
        <a class="level-node" th:href="@{/courses(target=${selectedTarget},level='ADVANCED')}"
           th:classappend="${selectedLevel == 'ADVANCED'} ? ' active' : ''">고급</a>
    </div>

    <p class="empty-state" th:if="${#lists.isEmpty(courses)}">조건에 맞는 코스가 없습니다.</p>

    <div class="card-grid" th:unless="${#lists.isEmpty(courses)}">
        <div class="card course-card" th:each="c : ${courses}">
            <span class="course-emoji" th:text="${c.emoji}"></span>
            <span class="badge" th:text="${c.targetType}"></span>
            <span class="badge" th:text="${c.level}"></span>
            <h3 th:text="${c.title}"></h3>
            <p th:text="${c.description}"></p>
            <a th:href="@{/courses/{id}(id=${c.id})}">레슨 보기 →</a>
        </div>
    </div>

    <p><a th:href="@{/}">홈으로</a></p>
</body>
</html>
