<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${course.title} + ' - eduplatform'"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div class="course-header">
        <span class="badge" th:text="${course.targetType}"></span>
        <span class="badge" th:text="${course.level}"></span>
        <h1 th:text="${course.title}"></h1>
        <p th:text="${course.description}"></p>
    </div>

    <p class="empty-state" th:if="${#lists.isEmpty(lessons)}">아직 등록된 레슨이 없습니다.</p>

    <ul class="lesson-list" th:unless="${#lists.isEmpty(lessons)}">
        <li th:each="lesson : ${lessons}">
            <span class="order-no" th:text="${lesson.orderNo} + '과'"></span>
            <a th:href="@{/lessons/{id}(id=${lesson.id})}" th:text="${lesson.title}"></a>
        </li>
    </ul>

    <p><a th:href="@{/courses}">코스 목록으로</a></p>
</body>
</html>
