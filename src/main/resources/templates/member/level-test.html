<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>레벨 테스트 - eduplatform</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <script th:src="@{/js/lesson-audio.js}" defer></script>
</head>
<body>
    <div th:replace="~{fragments/layout :: header}"></div>

    <main id="main-content" class="page">
    <h1>레벨 테스트</h1>
    <p>쉬운 문항부터 어려운 문항까지 8개예요. 어디까지 맞히는지에 따라 시작 레벨을 추천해 드려요.</p>

    <form th:action="@{/members/new/level-test}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="target" th:value="${target}"/>

        <fieldset class="quiz-question" th:each="q, qStat : ${questions}">
            <legend class="quiz-prompt" th:text="(${qStat.index} + 1) + '. ' + ${q.prompt}"></legend>
            <button type="button" class="listen-button" th:if="${q.audioText != null}"
                    th:attr="data-speak-text=${q.audioText}">🔊 듣기</button>
            <div class="quiz-options">
                <label th:each="opt, optStat : ${q.options}">
                    <input type="radio" th:name="'answer-' + ${q.id}" th:value="${optStat.index}"/>
                    <span th:text="${opt}"></span>
                </label>
            </div>
        </fieldset>

        <button type="submit">제출하고 레벨 추천받기</button>
    </form>

    <p><a th:href="@{/members/new}">건너뛰고 직접 선택하기</a></p>
    </main>
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
