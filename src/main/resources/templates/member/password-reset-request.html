<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>비밀번호 찾기 - eduplatform</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{fragments/layout :: header}"></div>

    <main id="main-content" class="page">
    <h1>비밀번호 찾기</h1>

    <ul class="error-message" th:if="${validationErrors}">
        <li th:each="msg : ${validationErrors}" th:text="${msg}"></li>
    </ul>

    <p th:if="${requested}">요청하신 이메일 주소로 재설정 안내를 보냈습니다(가입된 이메일인 경우).</p>

    <form th:unless="${requested}" th:action="@{/password-reset}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div>
            <label>이메일 <input type="email" name="email"/></label>
        </div>
        <button type="submit">재설정 링크 받기</button>
    </form>

    <p><a th:href="@{/login}">로그인으로 돌아가기</a></p>
    </main>
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
