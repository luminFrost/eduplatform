<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>새 비밀번호 설정 - eduplatform</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{fragments/layout :: header}"></div>

    <main id="main-content" class="page">
    <h1>새 비밀번호 설정</h1>

    <ul class="error-message" th:if="${validationErrors}">
        <li th:each="msg : ${validationErrors}" th:text="${msg}"></li>
    </ul>
    <p class="error-message" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <form th:unless="${errorMessage}" th:action="@{/password-reset/confirm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="token" th:value="${token}"/>
        <div>
            <label>새 비밀번호 <input type="password" name="newPassword"/></label>
        </div>
        <button type="submit">비밀번호 변경</button>
    </form>

    <p th:if="${errorMessage}"><a th:href="@{/password-reset}">다시 요청하기</a></p>
    </main>
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
