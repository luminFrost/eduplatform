<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>회원가입 - eduplatform</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{fragments/layout :: header}"></div>

    <main class="page">
    <h1>회원가입</h1>

    <ul class="error-message" th:if="${validationErrors}">
        <li th:each="msg : ${validationErrors}" th:text="${msg}"></li>
    </ul>
    <p class="error-message" th:if="${errorMessage}" th:text="${errorMessage}"></p>
    <p th:if="${recommendedLevel}">테스트 결과 추천 레벨: <strong th:text="${recommendedLevel}"></strong> — 아래에 미리 선택해뒀어요.</p>

    <form th:action="@{/members}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div>
            <label>이메일 <input type="email" name="email" th:value="${form?.email}"/></label>
        </div>
        <div>
            <label>닉네임 <input type="text" name="nickname" th:value="${form?.nickname}"/></label>
        </div>
        <div>
            <label>비밀번호 <input type="password" name="password"/></label>
        </div>
        <div>
            <label>회원 유형
                <select name="memberType">
                    <option th:each="type : ${memberTypes}"
                            th:value="${type}"
                            th:selected="${(form != null and form.memberType == type) or (form == null and recommendedTarget == type.name())}"
                            th:text="${type}"></option>
                </select>
            </label>
        </div>
        <div>
            <label>학습 레벨
                <select name="level">
                    <option th:each="lvl : ${levels}"
                            th:value="${lvl}"
                            th:selected="${(form != null and form.level == lvl) or (form == null and recommendedLevel == lvl.name())}"
                            th:text="${lvl}"></option>
                </select>
            </label>
            <a th:href="@{/members/new/level-test}">레벨을 모르겠어요? 간단 테스트로 추천받기 →</a>
        </div>
        <button type="submit">가입하기</button>
    </form>

    </main>
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
