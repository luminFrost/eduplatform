<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>회원 정보 - eduplatform</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{fragments/layout :: header}"></div>

    <main class="page">
    <h1 th:text="${member.nickname} + '님, 가입을 환영합니다'"></h1>

    <ul>
        <li th:text="'이메일: ' + ${member.email}"></li>
        <li th:text="'회원 유형: ' + ${member.memberType}"></li>
        <li th:text="'학습 레벨: ' + ${member.level}"></li>
        <li th:text="'가입일: ' + ${member.createdAt}"></li>
    </ul>

    <form th:action="@{/members/{id}/select(id=${member.id})}" method="post">
        <button type="submit">이 회원으로 학습 시작하기</button>
    </form>

    </main>
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
